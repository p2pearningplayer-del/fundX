name: FundX Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    name: Code Quality, Security & Automated Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Execute Security & Unit Test Suite
        run: npm test

      - name: Verify Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "https://fundx.enterprise.internal"
          NEXT_PUBLIC_API_URL: "https://fundx.enterprise.internal/api"

  container-build:
    name: Enterprise Docker Image Verification
    needs: audit-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Artifact
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: fundx-panel:latest
