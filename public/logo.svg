<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="neonX" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark: Modern Vault Hexagon with Interlocking X -->
  <g transform="translate(10, 10)">
    <!-- Outer Hex-Shield Vault -->
    <path d="M40 5 L75 25 L75 65 L40 85 L5 65 L5 25 Z" 
          stroke="url(#shieldGrad)" stroke-width="3.5" fill="#0b1329" fill-opacity="0.85" filter="url(#glow)"/>
    
    <!-- Inner Core Geometry -->
    <path d="M40 18 L64 32 L64 58 L40 72 L16 58 L16 32 Z" 
          stroke="#1e3a8a" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Glowing Interlocking "X" -->
    <path d="M26 30 L54 60 M54 30 L26 60" 
          stroke="url(#neonX)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Center Vault Core -->
    <circle cx="40" cy="45" r="4.5" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Brand Typography -->
  <text x="105" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-1">
    Fund<tspan fill="url(#neonX)">X</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="108" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" fill="#94a3b8" letter-spacing="3.5">
    INSTITUTIONAL ORCHESTRATION
  </text>
  
  <!-- Subtle Status Node -->
  <circle cx="375" cy="44" r="3.5" fill="#10b981"/>
</svg>
